<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Interview Prep — Master Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #222733;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --accent4: #10b981;
    --accent5: #ef4444;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-mid: #94a3b8;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --purple: #7c3aed;
    --cyan: #00e5ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,12,16,0.95);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .header-title { display: flex; align-items: center; gap: 14px; }
  .header-badge {
    background: linear-gradient(135deg, var(--accent2), var(--cyan));
    padding: 6px 14px; border-radius: 6px;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: #fff; font-weight: 700;
  }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .header h1 span { color: var(--cyan); }
  .stats-bar { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: center; }
  .stat-num { font-size: 20px; font-weight: 800; color: var(--cyan); font-family: 'Space Mono', monospace; }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .controls {
    padding: 20px 40px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 81px; z-index: 99;
    background: rgba(10,12,16,0.97);
  }
  .search-box {
    flex: 1; min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--cyan); }
  .filter-btn {
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text-mid);

  .filter-btn:hover, .filter-btn.active {
    background: var(--cyan); color: #000; border-color: var(--cyan);
  }
  .filter-btn[data-cat="Spring Boot"].active { background: var(--purple); color: #fff; border-color: var(--purple); }
  .filter-btn[data-cat="DSA"].active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  .filter-btn[data-cat="Database"].active { background: var(--green); color: #000; border-color: var(--green); }
  .filter-btn[data-cat="System Design"].active { background: var(--red); color: #fff; border-color: var(--red); }
  .filter-btn[data-cat="Kafka"].active { background: #f97316; color: #000; border-color: #f97316; }
  .filter-btn[data-cat="Microservices"].active { background: #ec4899; color: #fff; border-color: #ec4899; }
  .filter-btn[data-cat="Concurrency"].active { background: #22d3ee; color: #000; border-color: #22d3ee; }
  .main { padding: 32px 40px; display: flex; gap: 28px; }
  .sidebar {
    width: 260px; flex-shrink: 0;
    position: sticky; top: 145px; height: fit-content;

  .content { flex: 1; }

    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;

  .toc-list { list-style: none; }
  .toc-item {

  .toc-item:hover { background: var(--surface2); color: var(--text); border-left-color: var(--cyan); }
  .toc-item.active { background: var(--surface2); color: var(--cyan); border-left-color: var(--cyan); font-weight: 700; }
  .toc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .section-icon { font-size: 20px; }
  .section-title { font-size: 18px; font-weight: 800; }
  .section-count {

  .tag-dsa { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .tag-db { background: rgba(16,185,129,0.15); color: var(--green); }

  .str { color: #a5d6ff; }
  .fn { color: #d2a8ff; }
  .nm { color: #79c0ff; }
  .op { color: #ff7b72; }
  .tip-box {

  .complexity-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }

  .complexity-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); color: var(--text-mid); }

  .on { color: var(--yellow); font-family: 'Space Mono', monospace; font-weight: 700; }
  .ologn { color: #60a5fa; font-family: 'Space Mono', monospace; font-weight: 700; }

  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

  .no-results span { font-size: 36px; display: block; margin-bottom: 12px; }
  .check-btn {

    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    margin-left: 10px;

    color: transparent;

  .check-btn:hover { border-color: var(--green); background: rgba(16,185,129,0.1); }
  .check-btn.done {

  .card.read .card-header { opacity: 0.55; }
  .card.read .card-q { text-decoration: line-through; text-decoration-color: var(--text-dim); }
  .card.read { border-color: rgba(16,185,129,0.3); }
  .card.read .card-header { background: rgba(16,185,129,0.04); }
  .overall-progress {

    border: 1px solid var(--border);

  .prog-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700; }

  .filter-btn[data-cat="Unread"].active { background: #334155; color: var(--text); border-color: #475569; }

  @media (max-width: 900px) {

    .sidebar { width: 100%; position: static; }
    .controls { padding: 16px 20px; }
    .header { padding: 20px; }
  }

<script>
function fmt(answer, internal, scenario, why, adv, lim) {
  return `<p><strong>Answer:</strong> ${answer}</p>
<p><strong>Internal Working:</strong> ${internal}</p>
<p><strong>Real-time Scenario:</strong> ${scenario}</p>
<p><strong>Follow-up Questions:</strong></p>
<ul>
<li><strong>Why?</strong> ${why}</li>
<li><strong>Advantages?</strong> ${adv}</li>
<li><strong>Limitations?</strong> ${lim}</li>
</ul>`;
}

const sections = [
  {
    id: "core-java",
    title: "Core Java & Internals",
    icon: "☕",
    color: "#00e5ff",
    cat: "Core Java",
    questions: [
      {
        q: "How does HashMap work internally? What happens during a collision?",
        tags: ["java","java"],
        answer: fmt(
          "HashMap stores entries in an array of buckets. The bucket index is derived from the key's hashCode(), and when two keys hash to the same bucket, Java chains them (linked list, or a red-black tree once a bucket exceeds 8 entries) so no data is lost.",
          "On put(), Java spreads the hashCode by XOR-ing its upper 16 bits into the lower 16 (<code>h ^ (h &gt;&gt;&gt; 16)</code>) to reduce clustering, then computes <code>index = hash &amp; (capacity-1)</code>. If the bucket is empty, the node is inserted directly. If occupied, Java walks the chain comparing hashCode and equals() — if a match is found the value is replaced, otherwise the new node is appended. When the map's size exceeds <code>capacity × loadFactor</code> (default 0.75), the table doubles and every entry is rehashed into the new array.",
          "In bank-postings style services, a HashMap is often used as a short-lived local lookup — e.g. mapping ibwReference to a withdrawal record while processing a batch of Kafka records in a single consumer poll. Because HashMap is not thread-safe, this pattern only works when the map is confined to a single thread's local scope; anything shared across consumer threads must move to ConcurrentHashMap instead.",
          "Because array-index lookups are O(1), HashMap gives near-constant-time get/put, which is why it's the default choice over a list-based structure for key-based lookups.",
          "Very fast average-case lookup/insert (O(1)), flexible null key/value support, and predictable memory usage per entry.",
          "Not thread-safe (needs external synchronization or ConcurrentHashMap), worst-case O(n) before tree conversion, and a poor or missing hashCode()/equals() pair can silently break lookups."
        )
      },
      {
        q: "Fail-Fast vs Fail-Safe iterators — what's the difference?",
        tags: ["java"],
        answer: fmt(
          "Fail-fast iterators (ArrayList, HashMap) throw ConcurrentModificationException the moment they detect the underlying collection was structurally modified during iteration. Fail-safe iterators (CopyOnWriteArrayList, ConcurrentHashMap) iterate over a snapshot or a weakly-consistent view, so no exception is thrown even if the collection changes underneath.",
          "Fail-fast collections keep an internal <code>modCount</code> counter that increments on every structural change. The iterator captures modCount at creation and checks it on every next(); a mismatch throws CME. Fail-safe collections avoid this either by cloning the backing array on write (CopyOnWriteArrayList) or by iterating node-by-node without a global counter (ConcurrentHashMap), so an in-progress iteration is unaffected by concurrent puts.",
          "In a payments service, if one thread is iterating a cached list of pending withdrawal IDs while another thread updates it, using ArrayList would risk a CME under concurrent access; switching that shared structure to CopyOnWriteArrayList (read-heavy, rarely-written config-like lists) avoids the crash without needing manual locking.",
          "Fail-fast exists to surface programming bugs early rather than let iteration silently produce corrupted or inconsistent results.",
          "Fail-fast: cheap, catches bugs immediately. Fail-safe: safe for concurrent read/write, no crashes during iteration.",
          "Fail-fast can't reliably run alongside concurrent writers. Fail-safe has extra memory/copy overhead and may iterate slightly stale data."
        )
      },
      {
        q: "Why is String immutable in Java?",
        tags: ["java"],
        answer: fmt(
          "String is immutable so that once created, its value can never change — every operation that looks like a mutation (concat, substring, replace) actually returns a new String object, leaving the original untouched.",
          "Internally, String stores its characters in a final byte[] (or char[] pre-Java 9) with no public mutator methods. Because the array reference is never exposed or reassigned, the object graph can't be altered from outside. The JVM exploits this by caching Strings in the String Pool — multiple variables can safely share one instance — and by caching the computed hashCode() after first use.",
          "In `lbg-payto-integration`, a PayTo reference string like `IG-ABCDE-123456` is passed across multiple layers (Kafka producer, Honeycomb span attributes, DB lookup). Because String is immutable, it's safe to pass that same reference to several concurrent threads without defensive copying — no thread can accidentally corrupt what another thread is reading.",
          "Mutable Strings would break the String Pool (one mutation would corrupt every reference sharing that instance) and would be a security risk for things like class names, file paths, and network hosts.",
          "Thread-safety without synchronization, safe sharing via the String Pool, and a cached hashCode that makes String an efficient HashMap key.",
          "Every transformation allocates a new object, which increases GC pressure in hot paths — this is exactly why StringBuilder/StringBuffer exist for heavy string manipulation."
        )
      },
      {
        q: "How does ConcurrentHashMap work internally?",
        tags: ["java"],
        answer: fmt(
          "ConcurrentHashMap allows multiple threads to read and write concurrently without locking the whole map. Reads are essentially lock-free, and writes only synchronize on the specific bucket being modified, not the entire table.",
          "Pre-Java 8 it used 16 independent lock segments. From Java 8 onward, segments were removed: an empty bucket is filled using a CAS operation (no lock at all), and only when a bucket already has a chain does the code synchronize on that bucket's head node. Bins that grow beyond 8 entries convert to a red-black tree. size() uses striped counters (similar to LongAdder) to avoid contention, and table resizing is done cooperatively across threads.",
          "Multiple Kafka consumer threads processing withdrawal events from different partitions can safely update a shared reference map (e.g. deduplicating ibwReference values seen in-flight) using ConcurrentHashMap, since updates to unrelated keys never block each other.",
          "A fully-locked map would serialize every operation across threads, which kills throughput under the concurrency levels typical of payment-processing pipelines.",
          "High concurrent throughput, no full-map locks, and atomic helper methods like computeIfAbsent/merge that remove the need for manual synchronization.",
          "Iteration is only weakly consistent (no guaranteed snapshot), null keys/values are disallowed, and it can't provide atomicity across multiple keys — that still needs an external lock or transaction."
        )
      },
      {
        q: "Explain the Java Memory Model — Heap, Stack, GC cycles.",
        tags: ["java","perf"],

          "Lock escalation is a database optimization where many fine-grained row locks held by one transaction are automatically converted into a single coarser table (or page) lock to reduce the memory and management overhead of tracking huge numbers of individual locks — and yes, excessive or overly-broad locking is a very real scalability bottleneck.",
          "Tracking thousands of individual row locks costs the database real memory and CPU for lock-table bookkeeping; once a transaction's lock count crosses an internal threshold, the engine escalates to a single table-level lock covering the same data, trading precision for bookkeeping efficiency. The scalability cost is that a table-level lock now blocks every other transaction touching that table, even ones that would have been perfectly safe to run concurrently against completely different rows — an update touching many rows in one large batch transaction can inadvertently escalate and stall unrelated concurrent reads/writes on the same table.",
          "A large batch update against `BANK_WITHDRAWAL_REQUEST` touching thousands of rows in a single transaction risks triggering lock escalation, which would then block unrelated, perfectly-safe concurrent withdrawal lookups on completely different rows in that same table for the batch's whole duration — breaking the batch into smaller committed chunks avoids the escalation threshold entirely.",
          "This exists because tracking arbitrarily many fine-grained locks isn't free — the engine trades granularity for lock-table efficiency once the count gets large enough to matter.",
          "Escalation protects the database engine itself from excessive lock-table memory/CPU overhead under very large transactions.",
          "The concurrency cost of escalating to a table lock can be worse than the bookkeeping cost it was meant to avoid — chunking large batch operations into smaller transactions is the standard mitigation."
        )
      },
      {
        q: "Why can holding a lock while performing a network call be dangerous?",
        tags: ["lock","system"],
        answer: fmt(
          "Network calls have highly variable and sometimes very long latency (or can hang entirely on a slow/unresponsive downstream), so holding a lock for the duration of one turns a normally-brief critical section into an unbounded one — every other thread waiting on that lock is now at the mercy of a downstream system's availability, not just your own code's speed.",
          "A lock is meant to protect the shortest possible critical section needed to keep shared state consistent; a network call's duration is completely outside your control and can range from milliseconds to a full timeout period (seconds) or an indefinite hang if the call has no timeout configured at all. Every other thread contending for that same lock inherits that same unpredictable wait, and if enough threads pile up waiting, the effect cascades into thread-pool exhaustion exactly as if a stuck lock had no timeout at all.",
          "A withdrawal method that holds a per-account lock while calling out to a downstream bank API to confirm the debit is a design smell — the fix is to acquire the lock only for the local state check/update, release it, then perform the network call outside the locked section (using idempotency or a separate pending-state flag to handle the case where the call is in flight).",
          "This is the same root problem @Transactional-holding-a-connection-during-an-external-call has for DB connection pools — holding any bounded, contended resource for the duration of an unbounded external operation is dangerous regardless of which specific resource it is.",
          "Minimizing lock scope to only the in-memory/local-state work keeps critical sections short and predictable.",
          "Removing the network call from inside the lock often requires redesigning the flow (e.g. optimistic state transitions with compensation on failure) rather than a trivial code move, since the lock was likely there to prevent exactly the race the network call's asynchronicity now reintroduces."
        )
      },
      {
        q: "What happens when a synchronized method calls another synchronized method on the same object?",
        tags: ["lock","java"],
        answer: fmt(
          "It works fine — Java's intrinsic locks are reentrant, meaning a thread that already holds a given object's monitor can re-acquire it (and enter another synchronized method/block on that same object) without blocking on itself, since the JVM tracks a per-thread hold count rather than a simple boolean.",
          "Every monitor lock maintains an owning thread and a hold count. Entering a synchronized method increments the count if the calling thread already owns the lock (rather than blocking), and exiting decrements it; the lock is only actually released once the count returns to zero. Without reentrancy, a class whose synchronized method internally calls another synchronized method on `this` would deadlock against itself the moment it tried to nest — reentrancy is what makes that a completely safe, unremarkable pattern.",
          "A synchronized `debitAccount` method that internally calls a synchronized `validateBalance` helper on the same object relies entirely on this reentrancy — without it, this common, natural code structure would self-deadlock on every single call.",
          "Reentrancy exists because forbidding a thread from re-entering a lock it already holds would make normal method composition within a class extremely fragile and error-prone.",
          "Reentrant locking lets synchronized methods call each other freely without the developer needing to reason about self-deadlock.",
          "Reentrancy only protects against a thread deadlocking against itself — it does nothing to prevent deadlock between two different threads each waiting on a lock the other holds, which still requires careful lock ordering."
        )
      },
      {
        q: "How can nested locks across different services/classes create an unexpected deadlock?",
        tags: ["lock","java"],
        answer: fmt(
          "When two independent code paths acquire the same two locks in opposite order — thread A locks X then tries to lock Y, while thread B locks Y then tries to lock X — each ends up waiting for a lock the other already holds, and neither can proceed; this is especially easy to introduce accidentally when the locks belong to different classes/services that don't obviously appear related.",
          "Each individual method might look completely correct in isolation — locking its own object, then calling into a collaborator that locks a different object — but the deadlock only exists as an emergent property of two specific call paths happening to acquire the same pair of locks in reverse order relative to each other. Because the two call paths can live in entirely different classes or even different layers of the codebase, this kind of deadlock is very hard to spot from reading either method alone — it only shows up as a hang under specific concurrent timing, and a thread dump showing a genuine wait-for cycle is usually the fastest way to confirm it.",
          "A withdrawal-transfer method that locks the source account then the destination account, alongside a separate reconciliation method that locks the same two accounts in the reverse order for an unrelated reason, is a realistic setup for exactly this kind of cross-class deadlock — the fix is a globally agreed lock-acquisition order (e.g. always by ascending account ID) enforced everywhere both accounts might be locked together, regardless of which code path is doing the locking.",
          "This class of deadlock is dangerous specifically because no single method is 'wrong' by itself — the bug only exists in the interaction between two otherwise-correct pieces of code.",
          "A consistent, globally-enforced lock ordering convention eliminates this entire class of bug across the whole codebase, not just within one class.",
          "Enforcing a global lock-ordering convention across a large, multi-team codebase is a discipline problem, not a technical one — nothing in the language enforces it automatically."
        )
      },
      {
        q: "Production scenario: no obvious race condition in the code, but duplicate orders occasionally appear under high traffic. How would you investigate?",
        tags: ["lock","system"],
        answer: fmt(
          "Since the code has no obvious in-JVM race, the investigation has to widen beyond application-level synchronization to the layers a single-instance code review wouldn't catch: multiple instances racing on the same DB row, a missing idempotency mechanism, transaction isolation gaps, and client-side retry behavior.",
          "First, check whether the service runs multiple instances — if so, any in-process synchronized/ReentrantLock protection is a false sense of safety, since it doesn't coordinate across instances at all; the real protection needs to be a DB-level unique constraint or row lock. Second, check transaction isolation level against the actual read-then-write sequence used to create the order — READ COMMITTED allows the lost-update/duplicate-check-then-insert race described earlier. Third, check whether the client (or an upstream retry mechanism, or an API gateway retry policy) can send the same logical request twice under network timeouts, and whether there's an idempotency key mechanism catching that at all. Finally, correlation IDs and timestamps on the duplicate rows themselves usually reveal whether the two inserts came from the same client request (a client-retry problem) or from two different app instances processing what should have been one request (a cross-instance race problem) — which determines which of the above fixes is the actual one needed.",
          "This is precisely the investigation structure that led to the idempotency-key-style fix for the IBW double-credit bug — the root cause wasn't a Java-level race at all, but a cross-path duplicate (an MT910 refund notification processed as a fresh deposit) that only an ibw_reference-based DB check could catch, since no amount of in-process synchronization would have prevented it.",
          "'No obvious race in the code' is a strong signal the bug lives at a layer above single-JVM concurrency — cross-instance coordination, idempotency, or transaction isolation — rather than in the thread-safety of any one method.",
          "Systematically checking instance count, isolation level, and idempotency in that order narrows the search quickly instead of re-reading the same method for a bug that isn't there.",
          "Correlation IDs on the duplicate records are the single fastest way to distinguish a client-retry duplicate from a cross-instance race, since the two have completely different fixes."

      }

  }

let activeFilter = "All";

const STORAGE_KEY = "java_prep_read";
function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveReadSet(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch {}
}
function makeCardId(secId, qIdx) { return `${secId}__${qIdx}`; }

function toggleRead(cardId, btn, card) {
  const read = getReadSet();
  if (read.has(cardId)) {
    read.delete(cardId);
    btn.classList.remove("done");
    btn.textContent = "";
    card.classList.remove("read");
  } else {
    read.add(cardId);
    btn.classList.add("done");
    btn.textContent = "✓";
    card.classList.add("read");
  }
  saveReadSet(read);
  updateProgressUI();
}

function getTotalQuestions() {
  return sections.reduce((sum, s) => sum + s.questions.length, 0);
}

function updateProgressUI() {
  const read = getReadSet();
  const total = getTotalQuestions();
  const done = read.size;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-label").textContent = `${done} / ${total} read`;
  document.getElementById("read-count").textContent = done;
  document.getElementById("unread-count").textContent = total - done;
  document.getElementById("total-q").textContent = total;
}

function buildTOC() {
  const toc = document.getElementById("toc");
  sections.forEach(s => {
    const li = document.createElement("li");
    li.className = "toc-item";
    li.id = "toc-" + s.id;
    li.innerHTML = `<span class="toc-dot" style="background:${s.color}"></span>${s.title}`;
    li.onclick = () => {
      document.getElementById("sec-" + s.id)?.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    toc.appendChild(li);
  });
}

function renderSections(filter = "All", search = "") {
  const content = document.getElementById("content");
  const progBar = content.querySelector(".overall-progress");
  content.innerHTML = "";
  if (progBar) content.appendChild(progBar);

  const read = getReadSet();
  let totalShown = 0;

  sections.forEach(sec => {
    let matchesFilter = filter === "All" || sec.cat === filter;
    if (filter === "Read" || filter === "Unread") matchesFilter = true;

    if (!matchesFilter) return;

    const filteredQs = sec.questions.map((q, i) => ({q, i})).filter(({q, i}) => {
      const cardId = makeCardId(sec.id, i);
      const isRead = read.has(cardId);
      if (filter === "Read" && !isRead) return false;
      if (filter === "Unread" && isRead) return false;
      if (search && !q.q.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });

    if (filteredQs.length === 0) return;
    totalShown += filteredQs.length;

    const secReadCount = sec.questions.filter((_, i) => read.has(makeCardId(sec.id, i))).length;
    const secTotal = sec.questions.length;

    const div = document.createElement("div");
    div.className = "section";
    div.id = "sec-" + sec.id;

    div.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title" style="color:${sec.color}">${sec.title}</span>
        <span class="sec-prog">${secReadCount}/${secTotal}</span>
        <span class="section-count" style="margin-left:auto">${filteredQs.length} shown</span>
      </div>
    `;

    filteredQs.forEach(({q, i}) => {
      const cardId = makeCardId(sec.id, i);
      const isRead = read.has(cardId);

      const card = document.createElement("div");
      card.className = "card" + (isRead ? " read" : "");
      card.dataset.cat = sec.cat;
      card.dataset.cardId = cardId;

      const tagHtml = (q.tags || []).map(t => {
        const map = { java: ["Java","tag-java"], spring: ["Spring","tag-spring"], dsa: ["DSA","tag-dsa"], db: ["DB","tag-db"], kafka: ["Kafka","tag-kafka"], system: ["System","tag-system"], micro: ["Microservices","tag-micro"], perf: ["Performance","tag-perf"], lock: ["Locking","tag-lock"] };
        const [label, cls] = map[t] || [t, "tag-java"];
        return `<span class="tag ${cls}">${label}</span>`;
      }).join("");

      card.innerHTML = `
        <div class="card-header" onclick="toggleCard(this)">
          <span class="card-num">#${String(i+1).padStart(2,"0")}</span>
          <div style="flex:1">
            <div class="card-q">${q.q}</div>
            <div class="card-tags">${tagHtml}</div>
          </div>
          <span class="chevron">▾</span>
          <button class="check-btn ${isRead ? 'done' : ''}" title="Mark as read" onclick="event.stopPropagation(); toggleRead('${cardId}', this, this.closest('.card'))">${isRead ? '✓' : ''}</button>
        </div>
        <div class="card-body"><div class="answer-block">${q.answer}</div></div>
      `;
      div.appendChild(card);
    });

    content.appendChild(div);
  });

  if (totalShown === 0) {
    const msg = document.createElement("div");
    msg.className = "no-results";
    msg.innerHTML = `<span>🔍</span>No questions match your search.`;
    content.appendChild(msg);
  }

  updateProgressUI();
}

function toggleCard(header) {
  const card = header.parentElement;
  card.classList.toggle("open");
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderSections(activeFilter, document.getElementById("search").value);
}

function filterCards() {
  renderSections(activeFilter, document.getElementById("search").value);
}

buildTOC();
renderSections();
updateProgressUI();

window.addEventListener("scroll", () => {
  const sections_els = document.querySelectorAll(".section");
  let current = "";
  sections_els.forEach(s => {
    if (s.getBoundingClientRect().top < 200) current = s.id.replace("sec-", "");
  });
  document.querySelectorAll(".toc-item").forEach(t => {
    t.classList.toggle("active", t.id === "toc-" + current);
  });
});
</script>
</body>
