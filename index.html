<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Interview Prep — Master Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #222733;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --accent4: #10b981;
    --accent5: #ef4444;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-mid: #94a3b8;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --purple: #7c3aed;
    --cyan: #00e5ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,12,16,0.95);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .header-title { display: flex; align-items: center; gap: 14px; }
  .header-badge {
    background: linear-gradient(135deg, var(--accent2), var(--cyan));
    padding: 6px 14px; border-radius: 6px;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: #fff; font-weight: 700;
  }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .header h1 span { color: var(--cyan); }
  .stats-bar { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: center; }
  .stat-num { font-size: 20px; font-weight: 800; color: var(--cyan); font-family: 'Space Mono', monospace; }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

  /* Search + Filters */
  .controls {
    padding: 20px 40px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 81px; z-index: 99;
    background: rgba(10,12,16,0.97);
  }
  .search-box {
    flex: 1; min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--cyan); }
  .filter-btn {
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text-mid);
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--cyan); color: #000; border-color: var(--cyan);
  }
  .filter-btn[data-cat="Spring Boot"].active { background: var(--purple); color: #fff; border-color: var(--purple); }
  .filter-btn[data-cat="DSA"].active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  .filter-btn[data-cat="Database"].active { background: var(--green); color: #000; border-color: var(--green); }
  .filter-btn[data-cat="System Design"].active { background: var(--red); color: #fff; border-color: var(--red); }
  .filter-btn[data-cat="Kafka"].active { background: #f97316; color: #000; border-color: #f97316; }
  .filter-btn[data-cat="Microservices"].active { background: #ec4899; color: #fff; border-color: #ec4899; }

  /* Layout */
  .main { padding: 32px 40px; display: flex; gap: 28px; }
  .sidebar {
    width: 260px; flex-shrink: 0;
    position: sticky; top: 145px; height: fit-content;
  }
  .content { flex: 1; }

  /* Sidebar TOC */
  .toc-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text-dim); margin-bottom: 12px; font-weight: 700;
  }
  .toc-list { list-style: none; }
  .toc-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-mid); transition: all 0.15s;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
    border-left: 2px solid transparent;
  }
  .toc-item:hover { background: var(--surface2); color: var(--text); border-left-color: var(--cyan); }
  .toc-item.active { background: var(--surface2); color: var(--cyan); border-left-color: var(--cyan); font-weight: 700; }
  .toc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Section */
  .section { margin-bottom: 48px; }
  .section-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .section-icon { font-size: 20px; }
  .section-title { font-size: 18px; font-weight: 800; }
  .section-count {
    margin-left: auto; font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    background: var(--surface2); padding: 4px 10px; border-radius: 20px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 12px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .card:hover { border-color: #333a48; }
  .card-header {
    padding: 16px 20px; cursor: pointer;
    display: flex; align-items: flex-start; gap: 14px;
    transition: background 0.15s;
  }
  .card-header:hover { background: var(--surface2); }
  .card-num {
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--text-dim); flex-shrink: 0; padding-top: 2px;
    min-width: 28px;
  }
  .card-q { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.5; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .tag-java { background: rgba(0,229,255,0.12); color: var(--cyan); }
  .tag-spring { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .tag-dsa { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .tag-db { background: rgba(16,185,129,0.15); color: var(--green); }
  .tag-kafka { background: rgba(249,115,22,0.15); color: #fb923c; }
  .tag-system { background: rgba(239,68,68,0.15); color: #f87171; }
  .tag-micro { background: rgba(236,72,153,0.15); color: #f472b6; }
  .tag-perf { background: rgba(99,102,241,0.15); color: #818cf8; }

  .chevron {
    flex-shrink: 0; color: var(--text-dim); transition: transform 0.25s;
    font-size: 14px; padding-top: 1px;
  }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body {
    display: none; padding: 0 20px 20px 62px;
    border-top: 1px solid var(--border);
  }
  .card.open .card-body { display: block; }

  /* Answer styles */
  .answer-block { padding-top: 16px; }
  .answer-block p { font-size: 13.5px; color: var(--text-mid); line-height: 1.75; margin-bottom: 12px; }
  .answer-block strong { color: var(--text); }
  .answer-block ul, .answer-block ol { margin: 8px 0 12px 0; padding-left: 20px; }
  .answer-block li { font-size: 13px; color: var(--text-mid); line-height: 1.7; margin-bottom: 4px; }
  .answer-block li strong { color: var(--text); }

  .code-block {
    background: #0d1117; border: 1px solid #21262d;
    border-radius: 8px; padding: 14px 16px; margin: 10px 0;
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: #e6edf3; overflow-x: auto; line-height: 1.6;
    white-space: pre;
  }
  .kw { color: #ff7b72; }
  .cm { color: #8b949e; font-style: italic; }
  .str { color: #a5d6ff; }
  .fn { color: #d2a8ff; }
  .nm { color: #79c0ff; }
  .op { color: #ff7b72; }

  .tip-box {
    background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.2);
    border-radius: 8px; padding: 12px 16px; margin-top: 12px;
    font-size: 13px; color: var(--text-mid); line-height: 1.65;
  }
  .tip-box .tip-label { color: var(--cyan); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

  .warn-box {
    background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.2);
    border-radius: 8px; padding: 12px 16px; margin-top: 12px;
    font-size: 13px; color: var(--text-mid);
  }
  .warn-box .warn-label { color: var(--yellow); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

  .complexity-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .complexity-table th { background: var(--surface2); color: var(--text); padding: 8px 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .complexity-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); color: var(--text-mid); }
  .complexity-table tr:last-child td { border-bottom: none; }
  .o1 { color: var(--green); font-family: 'Space Mono', monospace; font-weight: 700; }
  .on { color: var(--yellow); font-family: 'Space Mono', monospace; font-weight: 700; }
  .ologn { color: #60a5fa; font-family: 'Space Mono', monospace; font-weight: 700; }

  /* Progress bar */
  .progress-section { margin-bottom: 24px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

  .no-results {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
    font-size: 15px;
  }
  .no-results span { font-size: 36px; display: block; margin-bottom: 12px; }

  /* Checkbox / Read state */
  .check-btn {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    margin-left: 10px;
    font-size: 13px;
    color: transparent;
    z-index: 10;
  }
  .check-btn:hover { border-color: var(--green); background: rgba(16,185,129,0.1); }
  .check-btn.done {
    background: var(--green); border-color: var(--green);
    color: #000;
  }
  .card.read .card-header { opacity: 0.55; }
  .card.read .card-q { text-decoration: line-through; text-decoration-color: var(--text-dim); }
  .card.read { border-color: rgba(16,185,129,0.3); }
  .card.read .card-header { background: rgba(16,185,129,0.04); }

  /* Overall progress */
  .overall-progress {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .prog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .prog-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700; }
  .prog-count { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--green); }
  .prog-track { height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 6px; transition: width 0.4s ease; }

  /* Section progress mini */
  .sec-prog { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--green); margin-left: 8px; }

  /* Read filter btn */
  .filter-btn[data-cat="Unread"].active { background: #334155; color: var(--text); border-color: #475569; }
  .filter-btn[data-cat="Read"].active { background: var(--green); color: #000; border-color: var(--green); }

  @media (max-width: 900px) {
    .main { flex-direction: column; padding: 20px; }
    .sidebar { width: 100%; position: static; }
    .controls { padding: 16px 20px; }
    .header { padding: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <div class="header-badge">6 YoE+</div>
    <h1>Java Interview <span>Prep</span> Dashboard</h1>
  </div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="total-q">150+</div><div class="stat-label">Questions</div></div>
    <div class="stat"><div class="stat-num" id="read-count" style="color:var(--green)">0</div><div class="stat-label">Read</div></div>
    <div class="stat"><div class="stat-num" id="unread-count" style="color:var(--yellow)">0</div><div class="stat-label">Remaining</div></div>
  </div>
</div>

<div class="controls">
  <input class="search-box" id="search" placeholder="🔍  Search questions..." oninput="filterCards()">
  <button class="filter-btn active" data-cat="All" onclick="setFilter('All', this)">All</button>
  <button class="filter-btn" data-cat="Core Java" onclick="setFilter('Core Java', this)">Core Java</button>
  <button class="filter-btn" data-cat="DSA" onclick="setFilter('DSA', this)">DSA</button>
  <button class="filter-btn" data-cat="Spring Boot" onclick="setFilter('Spring Boot', this)">Spring Boot</button>
  <button class="filter-btn" data-cat="Database" onclick="setFilter('Database', this)">Database</button>
  <button class="filter-btn" data-cat="Kafka" onclick="setFilter('Kafka', this)">Kafka</button>
  <button class="filter-btn" data-cat="Microservices" onclick="setFilter('Microservices', this)">Microservices</button>
  <button class="filter-btn" data-cat="System Design" onclick="setFilter('System Design', this)">System Design</button>
  <button class="filter-btn" data-cat="Read" onclick="setFilter('Read', this)">✅ Read</button>
  <button class="filter-btn" data-cat="Unread" onclick="setFilter('Unread', this)">⬜ Unread</button>
</div>

<div class="main">
  <nav class="sidebar">
    <div class="toc-title">Sections</div>
    <ul class="toc-list" id="toc"></ul>
    <div style="margin-top:28px">
      <div class="toc-title">Legend</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:var(--cyan);width:8px;height:8px;border-radius:50%;display:inline-block"></span>Core Java</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:var(--purple);width:8px;height:8px;border-radius:50%;display:inline-block"></span>Spring Boot</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:var(--yellow);width:8px;height:8px;border-radius:50%;display:inline-block"></span>DSA</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:var(--green);width:8px;height:8px;border-radius:50%;display:inline-block"></span>Database</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:#f97316;width:8px;height:8px;border-radius:50%;display:inline-block"></span>Kafka</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid)"><span style="background:#ec4899;width:8px;height:8px;border-radius:50%;display:inline-block"></span>Microservices</div>
      </div>
    </div>
  </nav>

  <div class="content" id="content">
    <div class="overall-progress">
      <div class="prog-top">
        <span class="prog-title">Overall Progress</span>
        <span class="prog-count" id="prog-label">0 / 0 read</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<script>
const sections = [
  {
    id: "core-java",
    title: "Core Java & Internals",
    icon: "☕",
    color: "#00e5ff",
    cat: "Core Java",
    questions: [
      {
        q: "How does HashMap work internally? What happens during a collision?",
        tags: ["java","java"],
        answer: `<p><strong>Bucket index calculation:</strong> <code>key.hashCode()</code> → spread via XOR of upper/lower bits → <code>index = hash & (n-1)</code>. The spread prevents clustering by distributing bits evenly.</p>
<div class="code-block"><span class="cm">// Simplified internal hash spread (Java 8)</span>
<span class="kw">static final int</span> <span class="fn">hash</span>(Object key) {
    <span class="kw">int</span> h;
    <span class="kw">return</span> (key == <span class="kw">null</span>) ? <span class="nm">0</span> : (h = key.<span class="fn">hashCode</span>()) ^ (h >>> <span class="nm">16</span>);
}</div>
<p><strong>Collision handling:</strong></p>
<ul>
  <li>Java 7: Linked list chaining — O(n) worst case</li>
  <li>Java 8+: Once a bucket exceeds <strong>8 entries</strong>, it converts to a <strong>Red-Black Tree</strong> — O(log n)</li>
  <li>Why 8? Poisson distribution — at load factor 0.75, probability of 8+ entries in one bucket is near zero (~0.00000006)</li>
</ul>
<p><strong>Resize behavior:</strong> When <code>size > capacity × 0.75</code>, the array doubles and ALL entries are rehashed. Set initial capacity if you know the expected size.</p>
<div class="tip-box"><div class="tip-label">⚡ Killer Answer</div>HashMap is not thread-safe. ConcurrentHashMap uses CAS + synchronized on individual nodes (Java 8) — never locks the entire map.</div>
<div class="warn-box"><div class="warn-label">⚠ Common Bug</div>Overriding equals() without overriding hashCode() causes objects to "disappear" from the map silently.</div>`
      },
      {
        q: "Fail-Fast vs Fail-Safe iterators — what's the difference?",
        tags: ["java"],
        answer: `<p><strong>Fail-Fast</strong> iterators (e.g., <code>ArrayList</code>, <code>HashMap</code>) throw <code>ConcurrentModificationException</code> if the collection is modified during iteration. They check a <code>modCount</code> field.</p>
<p><strong>Fail-Safe</strong> iterators (e.g., <code>CopyOnWriteArrayList</code>, <code>ConcurrentHashMap</code>) iterate over a snapshot copy — no exception, but may not reflect latest changes.</p>
<table class="complexity-table">
  <tr><th>Feature</th><th>Fail-Fast</th><th>Fail-Safe</th></tr>
  <tr><td>Exception on modify</td><td>✅ ConcurrentModificationException</td><td>❌ No exception</td></tr>
  <tr><td>Works on</td><td>Original collection</td><td>Cloned snapshot</td></tr>
  <tr><td>Memory overhead</td><td>Low</td><td>Higher</td></tr>
  <tr><td>Examples</td><td>ArrayList, HashMap</td><td>CopyOnWriteArrayList, ConcurrentHashMap</td></tr>
</table>`
      },
      {
        q: "Why is String immutable in Java?",
        tags: ["java"],
        answer: `<ul>
  <li><strong>String Pool:</strong> Multiple references can safely point to the same object. Mutability would corrupt other references.</li>
  <li><strong>Security:</strong> Class names, network connections, file paths — all Strings. Mutation would be a security hole.</li>
  <li><strong>Thread Safety:</strong> Immutable objects are inherently thread-safe — no synchronization needed.</li>
  <li><strong>Hash caching:</strong> hashCode is cached after first computation — used heavily in HashMap keys.</li>
</ul>
<div class="tip-box"><div class="tip-label">Follow-up</div>StringBuilder vs StringBuffer: both mutable. StringBuffer is synchronized (thread-safe, slower). StringBuilder is not synchronized (faster, single-thread use).</div>`
      },
      {
        q: "How does ConcurrentHashMap work internally?",
        tags: ["java"],
        answer: `<p><strong>Java 7:</strong> Divided into segments (default 16). Each segment is a separate lock — 16 threads can write concurrently.</p>
<p><strong>Java 8+:</strong> Eliminated segments entirely. Uses <strong>CAS (Compare-And-Swap)</strong> for lock-free reads and inserts. Synchronizes only on the <em>individual bucket head node</em> for writes — much finer granularity.</p>
<ul>
  <li>Reads are lock-free — always consistent</li>
  <li>Writes use CAS optimistically; fall back to synchronized on conflict</li>
  <li>Does NOT allow null keys or null values (unlike HashMap) — ambiguity in concurrent context</li>
</ul>
<div class="tip-box"><div class="tip-label">Key Insight</div>It NEVER locks the entire map. This is the fundamental difference from <code>Collections.synchronizedMap()</code>.</div>`
      },
      {
        q: "Explain the Java Memory Model — Heap, Stack, GC cycles.",
        tags: ["java","perf"],
        answer: `<ul>
  <li><strong>Stack:</strong> Per-thread. Holds method frames, local variables, references. LIFO. Fast allocation.</li>
  <li><strong>Heap:</strong> Shared across threads. All objects live here. GC manages it.</li>
  <li><strong>Heap Structure:</strong> Young Gen (Eden + S0 + S1) → Old Gen → Metaspace</li>
</ul>
<p><strong>GC Cycle:</strong> Minor GC collects Young Gen (frequent, fast). Major/Full GC collects Old Gen (rare, expensive — stop-the-world).</p>
<p><strong>GC Algorithms:</strong> G1 (default Java 9+), ZGC (low-latency, Java 15+), Shenandoah, CMS (deprecated).</p>
<div class="warn-box"><div class="warn-label">Memory Leak Causes</div>Static collections holding references, unclosed streams/connections, ThreadLocal not removed, inner class holding outer reference, listeners not deregistered.</div>`
      },
      {
        q: "volatile vs synchronized — when to use which?",
        tags: ["java"],
        answer: `<p><strong>volatile:</strong> Guarantees <em>visibility</em> — every read sees the latest write. Does NOT guarantee atomicity.</p>
<div class="code-block"><span class="kw">volatile boolean</span> running = <span class="kw">true</span>; <span class="cm">// safe for flag variables</span>
<span class="cm">// NOT safe: running++ is not atomic!</span></div>
<p><strong>synchronized:</strong> Guarantees both visibility AND atomicity. Uses monitor locks. More expensive.</p>
<ul>
  <li>Use <code>volatile</code>: simple flags, status variables, one writer many readers</li>
  <li>Use <code>synchronized</code>: compound operations (check-then-act), multiple field updates</li>
  <li>Use <code>AtomicInteger</code> etc. for counters — CAS-based, no full lock</li>
</ul>`
      },
      {
        q: "CompletableFuture vs ExecutorService — what's the difference?",
        tags: ["java"],

<p><strong>Compensating transactions:</strong> Each step must have a reversible action. E.g., payment deducted → on failure: issue refund.</p>
<div class="tip-box"><div class="tip-label">When to use</div>Choreography: simple flows, small teams, strong event-driven culture. Orchestration: complex multi-step flows (payments, order fulfillment), need for visibility and traceability.</div>`

  <li><strong>Async where possible:</strong> Decouple via message queue — slow consumer doesn't block producer.</li>

  <li><strong>DB:</strong> Enable slow query log. Check connection pool wait time (HikariCP metrics). N+1 queries?</li>
  <li><strong>External calls:</strong> Any synchronous HTTP calls to slow services? Add timeout + circuit breaker.</li>

  <li><strong>LinkedHashMap:</strong> HashMap + maintains insertion order (or LRU access order if constructed with accessOrder=true). O(1) operations. Use for LRU caches, predictable iteration.</li>
  <li><strong>TreeMap:</strong> Red-Black Tree, sorted by key, O(log n). Use when you need sorted keys, range queries (<code>subMap</code>, <code>headMap</code>, <code>floorKey</code>), or natural ordering.</li>

let activeFilter = "All";

// --- Read state (localStorage) ---
const STORAGE_KEY = "java_prep_read";
function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveReadSet(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch {}
}
function makeCardId(secId, qIdx) { return `${secId}__${qIdx}`; }

function toggleRead(cardId, btn, card) {
  const read = getReadSet();
  if (read.has(cardId)) {
    read.delete(cardId);
    btn.classList.remove("done");
    btn.textContent = "";
    card.classList.remove("read");
  } else {
    read.add(cardId);
    btn.classList.add("done");
    btn.textContent = "✓";
    card.classList.add("read");
  }
  saveReadSet(read);
  updateProgressUI();
}

function getTotalQuestions() {
  return sections.reduce((sum, s) => sum + s.questions.length, 0);
}

function updateProgressUI() {
  const read = getReadSet();
  const total = getTotalQuestions();
  const done = read.size;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-label").textContent = `${done} / ${total} read`;
  document.getElementById("read-count").textContent = done;
  document.getElementById("unread-count").textContent = total - done;
  document.getElementById("total-q").textContent = total;
}

// --- TOC ---
function buildTOC() {
  const toc = document.getElementById("toc");
  sections.forEach(s => {
    const li = document.createElement("li");
    li.className = "toc-item";
    li.id = "toc-" + s.id;
    li.innerHTML = `<span class="toc-dot" style="background:${s.color}"></span>${s.title}`;
    li.onclick = () => {
      document.getElementById("sec-" + s.id)?.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    toc.appendChild(li);
  });
}

// --- Render ---
function renderSections(filter = "All", search = "") {
  const content = document.getElementById("content");
  // preserve progress bar
  const progBar = content.querySelector(".overall-progress");
  content.innerHTML = "";
  if (progBar) content.appendChild(progBar);

  const read = getReadSet();
  let totalShown = 0;

  sections.forEach(sec => {
    let matchesFilter = filter === "All" || sec.cat === filter;
    if (filter === "Read" || filter === "Unread") matchesFilter = true; // handle below per-question

    if (!matchesFilter) return;

    const filteredQs = sec.questions.map((q, i) => ({q, i})).filter(({q, i}) => {
      const cardId = makeCardId(sec.id, i);
      const isRead = read.has(cardId);
      if (filter === "Read" && !isRead) return false;
      if (filter === "Unread" && isRead) return false;
      if (search && !q.q.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });

    if (filteredQs.length === 0) return;
    totalShown += filteredQs.length;

    // section read progress
    const secReadCount = sec.questions.filter((_, i) => read.has(makeCardId(sec.id, i))).length;
    const secTotal = sec.questions.length;

    const div = document.createElement("div");
    div.className = "section";
    div.id = "sec-" + sec.id;

    div.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title" style="color:${sec.color}">${sec.title}</span>
        <span class="sec-prog">${secReadCount}/${secTotal}</span>
        <span class="section-count" style="margin-left:auto">${filteredQs.length} shown</span>
      </div>
    `;

    filteredQs.forEach(({q, i}) => {
      const cardId = makeCardId(sec.id, i);
      const isRead = read.has(cardId);

      const card = document.createElement("div");
      card.className = "card" + (isRead ? " read" : "");
      card.dataset.cat = sec.cat;
      card.dataset.cardId = cardId;

      const tagHtml = (q.tags || []).map(t => {
        const map = { java: ["Java","tag-java"], spring: ["Spring","tag-spring"], dsa: ["DSA","tag-dsa"], db: ["DB","tag-db"], kafka: ["Kafka","tag-kafka"], system: ["System","tag-system"], micro: ["Microservices","tag-micro"], perf: ["Performance","tag-perf"] };
        const [label, cls] = map[t] || [t, "tag-java"];
        return `<span class="tag ${cls}">${label}</span>`;
      }).join("");

      card.innerHTML = `
        <div class="card-header" onclick="toggleCard(this)">
          <span class="card-num">#${String(i+1).padStart(2,"0")}</span>
          <div style="flex:1">
            <div class="card-q">${q.q}</div>
            <div class="card-tags">${tagHtml}</div>
          </div>
          <span class="chevron">▾</span>
          <button class="check-btn ${isRead ? 'done' : ''}" title="Mark as read" onclick="event.stopPropagation(); toggleRead('${cardId}', this, this.closest('.card'))">${isRead ? '✓' : ''}</button>
        </div>
        <div class="card-body"><div class="answer-block">${q.answer}</div></div>
      `;
      div.appendChild(card);
    });

    content.appendChild(div);
  });

  if (totalShown === 0) {
    const msg = document.createElement("div");
    msg.className = "no-results";
    msg.innerHTML = `<span>🔍</span>No questions match your search.`;
    content.appendChild(msg);
  }

  updateProgressUI();
}

function toggleCard(header) {
  const card = header.parentElement;
  card.classList.toggle("open");
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderSections(activeFilter, document.getElementById("search").value);
}

function filterCards() {
  renderSections(activeFilter, document.getElementById("search").value);
}

buildTOC();
renderSections();
updateProgressUI();

// TOC active highlight on scroll
window.addEventListener("scroll", () => {
  const sections_els = document.querySelectorAll(".section");
  let current = "";
  sections_els.forEach(s => {
    if (s.getBoundingClientRect().top < 200) current = s.id.replace("sec-", "");
  });
  document.querySelectorAll(".toc-item").forEach(t => {
    t.classList.toggle("active", t.id === "toc-" + current);
  });
});
</script>
